services:
  vk-bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      BOT_MODE: callback
      CALLBACK_HOST: 0.0.0.0
      CALLBACK_PORT: 8080
    ports:
      - "127.0.0.1:9080:8080"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  backend_net:
    external: true
